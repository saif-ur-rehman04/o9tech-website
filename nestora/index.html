<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=privacy-policy.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nestora — AI Interior Design & Decor</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #080a0f;
      --surface: #10141e;
      --border: rgba(226, 177, 112, 0.12);
      --accent: #e2b170;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --heading-font: 'DM Serif Display', serif;
      --body-font: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body-font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-family: var(--heading-font);
      font-size: 32px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 12px 20px;
      background: rgba(226, 177, 112, 0.08);
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .links a:hover {
      background: var(--accent);
      color: #080a0f;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Nestora</h1>
    <p>AI Interior Design & Home Decor by o9Tech</p>
    <div class="links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-conditions.html">Terms & Conditions</a>
      <a href="support.html">Support & Help Center</a>
    </div>
  </div>
</body>

</html>
