<script>
  // The link Nestora shares. Phones go straight to their own store;
  // everything else sees the page below with both stores.
  (function () {
    var appStore = 'https://apps.apple.com/us/app/nestora-ai-home-room-design/id6809705305';
    var play = 'https://play.google.com/store/apps/details?id=com.nestora.app' +
      '&referrer=utm_source%3Dnestora_smartlink%26utm_medium%3Dsocial';
    var ua = navigator.userAgent || '';
    // iPadOS reports a Mac user agent, so a Mac with touch is an iPad.
    var ios = /iPhone|iPad|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    if (ios) location.replace(appStore);
    else if (android) location.replace(play);
  })();
</script>
