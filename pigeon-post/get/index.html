<script>
  // The link the game shares. Phones go straight to their own store;
  // everything else sees the page below with both stores. When the game
  // is installed, the phone opens it before this page loads (Universal
  // Link on iOS, App Link on Android).
  (function () {
    var appStore = 'https://apps.apple.com/app/id6820972418';
    var play = 'https://play.google.com/store/apps/details?id=com.jst.pigeon_post' +
      '&referrer=utm_source%3Dpigeon_post_share%26utm_medium%3Dshare';
    var ua = navigator.userAgent || '';
    // iPadOS reports a Mac user agent, so a Mac with touch is an iPad.
    var ios = /iPhone|iPad|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    if (ios) location.replace(appStore);
    else if (android) location.replace(play);
  })();
</script>
